    <style>
      /* 首屏骨架：JS 与样式表就绪前先出文字；React 挂载后淡出移除（见 src/boot.ts） */
      html { background: #f6f6f4; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; text-align: center;
        background: #f6f6f4; color: #1c3a13;

      }
      #boot .bt { font-size: clamp(2.2rem, 7vw, 4.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }

      #boot .bd { max-width: 620px; font-size: 14.5px; line-height: 1.9; color: rgba(28, 58, 19, 0.72); }
      #boot .sp { width: 26px; height: 26px; margin-top: 6px; border: 2.5px solid rgba(28, 58, 19, 0.2); border-top-color: #2f9a10; border-radius: 50%; animation: gp-spin 0.9s linear infinite; }
      @keyframes gp-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html { background: #101a0c; }
        #boot { background: #101a0c; color: #f6f6f4; }
        #boot .bd { color: rgba(246, 246, 244, 0.72); }
