<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c3a13" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="GenePad 开发者技术文档入口，包含 .gen、.gjson 文件定义、Rust 读取示例和 SnapGene .dna 转换方案。"
    />
    <title>Developer Documentation - GenePad</title>
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://genepad.cn/tech-support.html" />
    <!-- 手绘 SVG 导出图，暂不启用 <link rel="icon" type="image/png" href="/icon.png" /> -->
    <link rel="icon" href="./icon.ico" sizes="any" />
    <style>
      /* 首屏骨架：JS 与样式表就绪前先出文字；React 挂载后淡出移除（见 src/boot.ts） */
      html { background: #f6f6f4; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; text-align: center;
        background: #f6f6f4; color: #1c3a13;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      #boot .bt { font-size: clamp(2.2rem, 7vw, 4.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
      #boot .bt small { display: block; margin-top: 10px; font-size: clamp(1rem, 2.4vw, 1.5rem); font-weight: 700; letter-spacing: 0.1em; color: #2f9a10; }
      #boot .bd { max-width: 620px; font-size: 14.5px; line-height: 1.9; color: rgba(28, 58, 19, 0.72); }
      #boot .sp { width: 26px; height: 26px; margin-top: 6px; border: 2.5px solid rgba(28, 58, 19, 0.2); border-top-color: #2f9a10; border-radius: 50%; animation: gp-spin 0.9s linear infinite; }
      @keyframes gp-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html { background: #101a0c; }
        #boot { background: #101a0c; color: #f6f6f4; }
        #boot .bd { color: rgba(246, 246, 244, 0.72); }
        #boot .sp { border-color: rgba(246, 246, 244, 0.22); border-top-color: #45c51f; }
      }
    </style>
    <script type="module" crossorigin src="./assets/tech-support-BNjxRu-h.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/boot-CDZlDIBs.js">
    <link rel="stylesheet" crossorigin href="./assets/boot-833VZBFT.css">
  </head>
  <body>
    <div id="boot">
      <div class="bt">GenePad<small>开发者技术文档 · DEV DOCS</small></div>
      <p class="bd">文件格式开发文档：.gen、.gjson 文件定义、Rust 读取示例与 SnapGene .dna 转换方案。</p>
      <div class="sp" role="status" aria-label="加载中"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
