<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c3a13" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="GenePad 개발자 문서 허브: .gen 및 .gjson 파일 정의, Rust 읽기 예제, SnapGene .dna 변환 가이드."
    />
    <title>개발자 문서 - GenePad</title>
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kr.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="zh-CN" href="https://cn.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="en" href="https://en.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="de" href="https://de.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="ru" href="https://ru.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="ja" href="https://jp.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="ko" href="https://kr.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="fr" href="https://fr.genepad.cn/tech-support" />
    <link rel="alternate" hreflang="x-default" href="https://genepad.cn/tech-support" />
    <link rel="icon" href="/icon.ico" sizes="any" />
    <style>
      /* 首屏骨架：JS 与样式表就绪前先出文字；React 挂载后淡出移除（见 src/boot.ts） */
      html { background: #f6f6f4; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; text-align: center;
        background: #f6f6f4; color: #1c3a13;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      #boot .bt { font-size: clamp(2.2rem, 7vw, 4.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
      #boot .bt small { display: block; margin-top: 10px; font-size: clamp(1rem, 2.4vw, 1.5rem); font-weight: 700; letter-spacing: 0.1em; color: #2f9a10; }
      #boot .bd { max-width: 620px; font-size: 14.5px; line-height: 1.9; color: rgba(28, 58, 19, 0.72); }
      #boot .sp { width: 26px; height: 26px; margin-top: 6px; border: 2.5px solid rgba(28, 58, 19, 0.2); border-top-color: #2f9a10; border-radius: 50%; animation: gp-spin 0.9s linear infinite; }
      @keyframes gp-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html { background: #101a0c; }
        #boot { background: #101a0c; color: #f6f6f4; }
        #boot .bd { color: rgba(246, 246, 244, 0.72); }
        #boot .sp { border-color: rgba(246, 246, 244, 0.22); border-top-color: #45c51f; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="bt">Developer Docs<small>DEV DOCS</small></div>
      <p class="bd">일상적인 분자 클로닝을 위한 가볍고 크로스 플랫폼 유전자 지도 편집기입니다. 플라스미드 맵 열람·편집, 서열 주석 관리, 제한효소 부위 분석, Sanger 시퀀싱 트레이스 비교를 지원합니다.</p>
      <div class="sp" role="status" aria-label="불러오는 중"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/tech-main.tsx"></script>
  </body>
</html>
