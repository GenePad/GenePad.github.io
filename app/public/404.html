<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c3a13" media="(prefers-color-scheme: dark)" />
    <title>页面不存在 404 - GenePad</title>
    <!-- 顶层 404.html 让静态托管返回真正的 404 状态码（Cloudflare Pages 与 GitHub Pages 都认这个文件）；
         没有它时 Pages 会按 SPA 兜底把任意未知路径映射到首页并返回 200，造成软 404。 -->
    <link rel="icon" href="/icon.ico" sizes="any" />
    <style>
      :root { color-scheme: light dark; }
      html { background: #f6f6f4; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f6f4;
        color: #1c3a13;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      .card { width: 100%; max-width: 640px; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #2f9a10;
      }
      h1 { margin: 12px 0 0; font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: -0.02em; }
      p { margin: 16px 0 0; font-size: 15px; line-height: 1.9; color: rgba(28, 58, 19, 0.72); }
      .rule { height: 2px; margin: 28px 0 0; background: #1c3a13; }
      ul { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
      li { display: flex; align-items: baseline; gap: 12px; font-size: 14px; }
      li span.no {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: rgba(28, 58, 19, 0.45);
      }
      a { color: #1c3a13; text-decoration: none; border-bottom: 1px solid rgba(28, 58, 19, 0.35); }
      a:hover { border-bottom-color: #2f9a10; color: #2f9a10; }
      .en { margin-top: 36px; padding-top: 24px; border-top: 1px solid rgba(28, 58, 19, 0.18); }
      .en h2 { margin: 0; font-size: 15px; font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #101a0c; color: #f6f6f4; }
        p { color: rgba(246, 246, 244, 0.72); }
        .rule { background: #f6f6f4; }
        a { color: #f6f6f4; border-bottom-color: rgba(246, 246, 244, 0.35); }
        li span.no { color: rgba(246, 246, 244, 0.45); }
        .en { border-top-color: rgba(246, 246, 244, 0.2); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">Error 404</div>
      <h1>这个页面不存在</h1>
      <p>
        你访问的地址可能已经移动或从未存在。下面这些入口也许能帮上忙：
      </p>
      <div class="rule"></div>
      <ul>
        <li><span class="no">01</span><a href="https://genepad.cn/">回到首页</a></li>
        <li><span class="no">02</span><a href="https://genepad.cn/tutorial">使用教程</a></li>
        <li><span class="no">03</span><a href="https://genepad.cn/tech-support">开发者文档</a></li>
        <li><span class="no">04</span><a href="https://genepad.cn/changelog">更新日志</a></li>
        <li><span class="no">05</span><a href="https://genepad.cn/#download">下载安装</a></li>
      </ul>

      <section class="en" lang="en">
        <h2>Page not found</h2>
        <p>
          The address you opened may have moved or never existed. Try the
          <a href="https://en.genepad.cn/">home page</a>,
          the <a href="https://en.genepad.cn/tutorial">tutorials</a>,
          or the <a href="https://en.genepad.cn/tech-support">developer docs</a>.
        </p>
      </section>
    </main>
  </body>
</html>
